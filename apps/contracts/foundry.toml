[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[fuzz]
runs = 10000

[invariant]
runs = 512
depth = 64
fail_on_revert = false
